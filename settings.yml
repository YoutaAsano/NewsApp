# ============================================================
#  Money Signal の設定ファイル
# ============================================================
# GitHub の画面でこのファイルを編集し「Commit changes」で保存すると、
# 数分後にサイトへ反映されます（ニュースの再収集と AI まとめの再作成が自動で行われます）。
#
# 書き方の注意:
#   - 行頭のスペース（字下げ）に意味があります。スペースの数は変えないでください。
#   - 行頭に # を付けた行は無視されます（一時的に無効にしたいときに使えます）。

# ------------------------------------------------------------
# 収集するニュースのジャンル
# ------------------------------------------------------------
# 使えるジャンル:
#   markets … 経済・マーケット
#   world   … 世界情勢
#   tech    … テクノロジー
#   crypto  … 暗号資産
#   games   … ゲーム業界
genres:
  - markets
  - world
  - tech
  - crypto
  - games

# ------------------------------------------------------------
# AI によるまとめ（要約）
# ------------------------------------------------------------
# 1日2回（日本時間 7時・18時ごろ）、ここに書いたまとめを作成します。いくつでも追加できます。
#   id       … 英数字の識別名（変えると過去のまとめが引き継がれません）
#   name     … アプリに表示する名前
#   genres   … まとめの対象にするジャンル（上の genres で収集しているもの）
#   label    … 各ニュースに添える解説の見出し（例: 投資の視点、業界への影響）
#   prompt   … AI への指示。何を重要とみなすか、どんな観点で書くかを自由に書けます。
#              （出力の形式や根拠記事の扱いは自動で指示されるので、書かなくて大丈夫です）
digests:
  - id: invest
    name: 重要ニュース
    genres: [markets, world, tech, crypto]
    label: 投資の視点
    prompt: |
      あなたは個人投資家向けのマーケットアナリストです。
      資産を増やしたい個人投資家にとって「今日特に重要なニュース」を5〜8件選び、要約してください。

      重要度の基準:
      - 出来事の規模が大きい（市場全体・複数国・主要企業に影響する、政策や金利・為替の大きな変化、大規模な紛争や合意など）
      - 資産を増やす観点でチャンスになり得る（成長分野の追い風、割安になった資産、規制緩和、好決算、新技術の商用化など）
      - 大きなリスク要因で、資産を守るために知っておくべきもの
      - 同じ話題を複数の配信元が報じているものは重要度が高い可能性がある
      - スポーツ・芸能・事件など投資に関係しない話題、細かな製品レビューは選ばない

      解説では、どの資産にどんな影響があり得るかを具体的に書いてください。
      ただし特定銘柄の売買を断定的に推奨しないでください。
      概況ではマーケット指標の動きにも触れてください。

  - id: games
    name: ゲーム業界
    genres: [games]
    label: 業界への影響
    prompt: |
      あなたはゲーム業界に詳しいアナリストです。
      ゲーム業界の動向を追いたい読者に向けて、今日の重要なニュースを5〜8件選び、要約してください。

      重要度の基準:
      - 業界全体に影響する動き（新ハード・プラットフォーム、ビジネスモデルの変化、規制や訴訟、大型の買収・提携・人員削減）
      - 主要企業の決算・業績予想・経営方針の発表
      - 大型タイトルの発表・発売・販売本数など、市場の勢いがわかるもの
      - 関連企業の株価や業績に影響し得るもの
      - 個別タイトルのセール情報、攻略記事、小さなアップデートは選ばない

      解説では、業界や関連企業（任天堂、ソニー、カプコンなど）にどんな影響があり得るかを書いてください。
