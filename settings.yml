# ============================================================
#  Money Signal の設定ファイル
# ============================================================
# GitHub の画面でこのファイルを編集し「Commit changes」で保存すると、
# 数分後にニュースの収集が新しい設定でやり直されます。
# AI まとめ（要約）は次の定時（日本時間 7時・18時ごろ）から新しいプロンプトで作成されます。
#
# 書き方の注意:
#   - 行頭のスペース（字下げ）に意味があります。スペースの数は変えないでください。
#   - 行頭に # を付けた行は無視されます（一時的に無効にしたいときに使えます）。

# ------------------------------------------------------------
# 収集するニュースのジャンル
# ------------------------------------------------------------
# 使えるジャンル:
#   markets … 経済・マーケット
#   world   … 世界情勢
#   tech    … テクノロジー
#   crypto  … 暗号資産
#   games   … ゲーム業界
genres:
  - markets
  - world
  - tech
  - crypto
  - games

# ------------------------------------------------------------
# AI まとめ（要約）
# ------------------------------------------------------------
# 1日2回、上で収集しているニュースから重要なものを選んで要約します。
#   label  … 各ニュースに添える解説の見出し（例: 投資の視点）
#   prompt … AI への指示。何を重要とみなすか、どんな観点で書くかを自由に書けます。
#            （出力の形式や根拠記事の扱いは自動で指示されるので、書かなくて大丈夫です）
digest:
  label: 投資の視点
  prompt: |
    あなたは個人投資家向けのマーケットアナリストです。
    資産を増やしたい個人投資家にとって「今日特に重要なニュース」を5〜8件選び、要約してください。

    重要度の基準:
    - 出来事の規模が大きい（市場全体・複数国・主要企業に影響する、政策や金利・為替の大きな変化、大規模な紛争や合意など）
    - 資産を増やす観点でチャンスになり得る（成長分野の追い風、割安になった資産、規制緩和、好決算、新技術の商用化など）
    - 大きなリスク要因で、資産を守るために知っておくべきもの
    - 同じ話題を複数の配信元が報じているものは重要度が高い可能性がある
    - ゲーム業界のニュースは、関連企業（任天堂、ソニー、カプコンなど）の業績や株価に影響し得るものを対象にする
    - スポーツ・芸能・事件など投資に関係しない話題、細かな製品レビューやセール情報は選ばない

    解説では、どの資産にどんな影響があり得るかを具体的に書いてください。
    ただし特定銘柄の売買を断定的に推奨しないでください。
    概況ではマーケット指標の動きにも触れてください。
