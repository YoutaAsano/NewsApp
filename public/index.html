<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Money Signal</title>
  <meta name="description" content="資産形成に役立つ経済・マーケット・世界情勢・テクノロジーのニュースだけを集めたニュースリーダー">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
  <script>
    // テーマ設定を描画前に反映してちらつきを防ぐ
    try {
      const t = JSON.parse(localStorage.getItem('ms:prefs') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Money Signal ホーム">
        <img src="icon.svg" alt="" width="28" height="28">
        <span>Money Signal</span>
      </a>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
        <input id="q" type="search" placeholder="キーワードで絞り込み（例: 日銀, NVIDIA）" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="actions">
        <button id="refresh" class="icon-btn" type="button" title="最新に更新" aria-label="最新に更新">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 0 1 7.4 5H17v2h6V5h-2v2.7A10 10 0 1 0 22 12h-2a8 8 0 1 1-8-8Z"/></svg>
        </button>
        <button id="open-settings" class="icon-btn" type="button" title="設定" aria-label="設定">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </header>

    <nav class="sidebar" aria-label="カテゴリ">
      <ul id="categories" class="tabs" role="tablist"></ul>
      <div class="side-section">
        <h3>トピック</h3>
        <div id="topics" class="chips"></div>
      </div>
      <div class="side-section side-lang">
        <h3>言語</h3>
        <div class="seg lang-seg" role="radiogroup" aria-label="言語">
          <button type="button" data-lang="all" role="radio">すべて</button>
          <button type="button" data-lang="ja" role="radio">日本語</button>
          <button type="button" data-lang="en" role="radio">英語</button>
        </div>
      </div>
    </nav>

    <main class="main">
      <section id="markets" class="markets" aria-label="マーケット指標" hidden></section>

      <div class="mobile-filters">
        <div class="seg lang-seg" role="radiogroup" aria-label="言語">
          <button type="button" data-lang="all" role="radio">すべての言語</button>
          <button type="button" data-lang="ja" role="radio">日本語</button>
          <button type="button" data-lang="en" role="radio">英語</button>
        </div>
        <div id="topics-mobile" class="chips scroll-x"></div>
      </div>

      <div class="status-line">
        <span id="count"></span>
        <span id="updated"></span>
      </div>

      <div id="digest-banner" class="digest-banner" hidden></div>
      <div id="digest-view" class="digest" hidden></div>
      <div id="list" class="list" aria-live="polite"></div>
      <button id="more" class="more" type="button" hidden>さらに表示</button>
      <p id="empty" class="empty" hidden></p>
    </main>
  </div>

  <dialog id="settings" class="settings">
    <form method="dialog">
      <header>
        <h2>設定</h2>
        <button class="icon-btn" value="close" aria-label="閉じる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4Z"/></svg>
        </button>
      </header>

      <section>
        <h3>表示</h3>
        <label class="row"><input type="checkbox" id="hide-read"> 既読の記事を隠す</label>
        <label class="row"><input type="checkbox" id="show-images"> サムネイル画像を表示</label>
        <label class="row">テーマ
          <select id="theme">
            <option value="system">端末の設定に合わせる</option>
            <option value="light">ライト</option>
            <option value="dark">ダーク</option>
          </select>
        </label>
      </section>

      <section>
        <h3>ミュートするキーワード</h3>
        <p class="hint">タイトルにこの語を含む記事を非表示にします。カンマまたは改行で区切ってください。</p>
        <textarea id="muted-words" rows="3" placeholder="例: 宝くじ, 芸能人"></textarea>
      </section>

      <section>
        <h3>ニュースソース</h3>
        <p class="hint">チェックを外したソースは表示されません。</p>
        <div id="sources" class="sources"></div>
      </section>

      <section>
        <h3>データ</h3>
        <button type="button" id="clear-read" class="btn">既読履歴をリセット</button>
      </section>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
