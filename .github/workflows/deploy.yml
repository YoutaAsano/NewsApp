name: Update news & deploy

on:
  push:
    branches: [main]
  schedule:
    # 約30分ごとにニュースを収集して再デプロイ（GitHub の混雑状況により数分遅れることがあります）
    - cron: '7,37 * * * *'
    # 重要ニュースのまとめを生成（日本時間 7:03 と 18:03）
    - cron: '3 22,9 * * *'
  workflow_dispatch:
    inputs:
      digest:
        description: 'AI まとめも生成する'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # まとめを作るのは「朝夕の定時」「手動実行」「settings.yml などの変更が main に入ったとき」
      GENERATE_DIGEST: ${{ github.event.schedule == '3 22,9 * * *' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.digest) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
        id: pages
      - name: Fetch news
        run: npm run fetch
      - name: Install Claude Code
        if: env.GENERATE_DIGEST == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Digest (carry over past 30 days / generate today's)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/digest.mjs ${{ env.GENERATE_DIGEST == 'true' && '--generate' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
